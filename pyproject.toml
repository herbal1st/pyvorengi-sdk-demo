[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvorengi-web-demo"
version = "0.9.3"
description = "Web-optimized version of the PyVorengi 3D Voxel Engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "herbal1st" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Side-Scrolling/3D",
]
dependencies = [
    "pygame-ce>=2.0.0",
    "numpy>=1.20.0",
    "pyyaml"
]

[project.urls]
Homepage = "https://github.com/herbal1st/pyvorengi-sdk-demo"

[tool.pygodide]
canvas-width=1024
canvas-height=576
canvas-fit=true